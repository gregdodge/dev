<script>
function getLocation() {
    const messageElement = document.getElementById("message");
    const latElement = document.getElementById("latitude");
    const lonElement = document.getElementById("longitude");
    const url = `ttps://www.google.com/maps/place/${latElement}+${lonElement}`;

    if (navigator.geolocation) {
        messageElement.textContent = "Fetching location...";
        // The getCurrentPosition method is asynchronous and takes success and optional error callbacks.
        navigator.geolocation.getCurrentPosition(
            function(position) {
                // Success callback: updates the HTML elements with the coordinates
                latElement.textContent = position.coords.latitude;
                lonElement.textContent = position.coords.longitude;
                messageElement.textContent = "Location found.";
            },
            function(error) {
                // Error callback: handles potential errors (e.g., user denies permission)
                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        messageElement.textContent = "User denied the request for Geolocation.";
                        break;
                    case error.POSITION_UNAVAILABLE:
                        messageElement.textContent = "Location information is unavailable.";
                        break;
                    case error.TIMEOUT:
                        messageElement.textContent = "The request to get user location timed out.";
                        break;
                    case error.UNKNOWN_ERROR:
                        messageElement.textContent = "An unknown error occurred.";
                        break;
                }
            }
        );
    } else {
        // Geolocation is not supported by the browser.
        messageElement.textContent = "Geolocation is not supported by this browser.";
    }
}
</script>
