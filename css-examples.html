<p><b>Example 1 - Dropdown:</b></p>

<style>
.dropbtn {
  background-color: cornflowerblue;
  color: white;
  font-weight: bold;
  font-family: verdana;
  padding: 16px 20px;
  font-size: 16px;
  border: none;
}
/* The container <div> - needed to position the dropdown content */
.dropdown {
  position: relative;
  display: inline-block;
}
/* Dropdown Content (Hidden by Default) */
.dropdown-content {
  display: none;
  position: absolute;
  background-color: #f1f1f1;
  font-family: verdana;
  font-weight: bold;
  min-width: 160px;
  box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
  z-index: 1;
}
/* Links inside the dropdown */
.dropdown-content a {
  color: black;
  padding: 12px 16px;
  text-decoration: none;
  display: block;
}
/* Change color of dropdown links on hover */
.dropdown-content a:hover {background-color: #ddd;}
/* Show the dropdown menu on hover */
.dropdown:hover .dropdown-content {display: block;}
/* Change the background color of the dropdown button when the dropdown content is shown */
.dropdown:hover .dropbtn {background-color: #3e8e41;}
</style>  

<p>&nbsp;</p>

<div align="center">
  
<div class="dropdown">
  <button class="dropbtn">Dropdown 1</button>
  <div class="dropdown-content">
    <a href="https://gregdodge.github.io/">Link 1</a>

</div>

  <p><b>Example 2 - Animation:</b></p>
  
  <style>
  /* 1. Base styles for the button */
  .bouncing-btn1 {
    display: inline-block; /* Essential for transform to work correctly on all elements */
    padding: 15px 30px;
    margin: 35px 15px;
    font-size: 16px;
    color: white;
    font-weight: bold;
    font-family: verdana;
    letter-spacing: 1.3px;
    background-color: orange;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: transform 0.2s ease; /* Smooth transition when the hover starts/stops */
  }
  .bouncing-btn2 {
    display: inline-block; /* Essential for transform to work correctly on all elements */
    padding: 15px 30px;
    margin: 35px 15px;
    font-size: 16px;
    color: white;
    font-weight: bold;
    font-family: verdana;
    letter-spacing: 1.3px;
    background-color: lightgreen;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: transform 0.2s ease; /* Smooth transition when the hover starts/stops */
  }    
  /* 2. Apply the animation on hover */
  .bouncing-btn:hover {
    animation: bounce 1s infinite; /* Animation name, duration, and infinite loop */
  }
  /* 3. Define the keyframe animation */
  @keyframes bounce {
    0%, 100% {
      transform: translateY(0); /* Start and end position (at rest) */
    }
    50% {
      transform: translateY(-10px); /* Mid-point position (the "bounce" up) */
    }
  }
  </style>
  
  <div align="center">  
    
  <a href="http://www.hover.com"><button class="bouncing-btn1">Hover</button></a>
  <a href="http://www.hover.com"><button class="bouncing-btn2">Hover</button></a>
  
  </div>

  <p><b>Example 3 - Pop-out:</b></p>

  <!-- Grid -->
  <style>
   /* Grid */ 
   .itemcontainer {
      margin: auto;
      width: 70%;
      align-content: center;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      padding-top: 30px;
  }
   .item {
      border: 1px solid green;
      border-radius: 10px;
      padding: 25px;
   }
   .item:hover {
      background-color: orange;
      border: 1px solid green;
      color: white;
   }   
   /* /Grid */
    a {
      font-family: verdana;
      color: green;
      background-color: none;
      font-weight: bold;
      font-size: 14px;
      text-decoration: none;
    } 
    
    a:hover {
      color: #003555;
      background-color: none;
    }
   .overlay {
    visibility: hidden;
    opacity: 0;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    transition: opacity 0.2s, visibility 0.2s; /* Smooth transition */
  }
  .overlay:target {
    visibility: visible;
    opacity: 1;
  }
  .popup {
    background-color: #fff;
    padding: 20px;
    border-radius: 5px;
    max-width: 50%;
    text-align: center;
  }
  .close-button {
    margin-top: 10px;
    display: inline-block;
    color: #aaa;
    text-decoration: none;
  }
  </style>

<p><b>Example 4 - Transparent:</b></p>
  
  <style>
  .transparent-on-hover {
    /* Initial styles */
    background-color: #007bff; /* Initial background color, e.g., blue */
    color: white; /* Initial text color */
    font-size: 16px;
    letter-spacing: 1.5px;
    font-weight: bold;
    padding: 20px 40px;
    width: 50%; /* Must have a defined width */
    margin: 0 auto; /* Centers the element horizontally */
    display: block; /* Ensures the element is block-level */
    border: 2px solid #007bff; /* Initial border color */
    border-radius: 10px;
    cursor: pointer;
    transition: background-color 0.4s ease; /* Smooth transition for background color */
  }
  
  .transparent-on-hover:hover {
    /* Styles on hover */
    background-color: transparent;
    font-size: 16px;
    letter-spacing: 1.5px;
    font-weight: bold;
    color: #FFF; /* Change text color to match border for visibility */
  } 
  </style>

  <div align="center">
   <div style="background-image: url('https://assets.wfcdn.com/im/30402603/resize-h600-w600%5Ecompr-r85/2232/223225455/%22+Sunset+Or+Sunrise+%22+by+Flavijus.jpg');background-position:center;background-size:cover;background-color: #cccccc;width:300px;height:200px;padding-top:150px;">  
     <button class="transparent-on-hover">Hover</button>
   </div>
  </div>

  <p><b>Example 5 - Transition:</b></p>

<style>
.zoom {
  padding: 50px;
  background-image: url('https://assets.wfcdn.com/im/30402603/resize-h600-w600%5Ecompr-r85/2232/223225455/%22+Sunset+Or+Sunrise+%22+by+Flavijus.jpg');
  background-position:center;background-size:cover;
  transition: transform .2s; /* Animation */
  width: 200px;
  height: 200px;
  margin: 0 auto;
}

.zoom:hover {
  transform: scale(1.5); /* (150% zoom - Note: if the zoom is too large, it will go outside of the viewport) */
}
</style>

<div class="zoom"></div>
  
</div>
