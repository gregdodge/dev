	<script id="rendered-js" >
		const textSlider = document.querySelector('.text-slider');
		const words = textSlider.dataset.words.split(',');
		const log = i => {
		  if (i < words.length) {
		setTimeout(function () {
		  textSlider.innerHTML = words[i];
		  i++;
		  if (i == words.length) i = 0;
		  log(i);
		}, 1000);
	  	}
		};
		log(0);
		//# sourceURL=pen.js
    </script>			

	<button class="btn">Switch Players</button>

	<script>
		const switchBtn = document.querySelector(".btn");
		const box1El = document.querySelector(".box--1");
		switchBtn.addEventListener("click", function () {
		  const active = document.querySelector('.active');
		  if(active){
		    const notActive = document.querySelector('.box:not(.active)')
		    notActive.classList.add('active')
		    active.classList.remove('active')
		  }else{
		    box1El.classList.add('active')
		  }
		});
	</script>

	<p><b>Example 3:</b></p>

	<style>
	.accordion {
	  max-width: 100%;
	  margin: 50px auto;
	  display: flex;
	  flex-direction: column;
	}
	.items {
	  border-top: 4px solid white;/*ADDED TOP BORDER TO STOP LAYOUT SHIFT*/
	  cursor:pointer;
	  box-shadow: 0 0 32px 0 rgba(0, 0, 0, 0.1);
	  padding: 24px;
	  display: grid;
	  grid-template-columns: auto 1fr auto;
	  column-gap: 10px;
	  transition:all 0.3s;
	}
	.items:not(:first-child){
	  margin-top:24px;
	}
	.icon{
	  transition: all 0.3s;
	}
	.items.open svg{
	  transform: rotate(180deg);
	}
	.icon,
	.text {
	align-self: center;
	}
	.hidden-box {
	  max-height:0;
	  overflow:hidden;
	  transition: all 0.3s;
	  box-shadow: 0 0 32px 0 rgb(0 0 0 / 10%);
	}
	.hidden-box .inner{
	  padding:20px;
	  grid-column: 2;
	  display: grid;
	}
	.open {
	  border-top: 4px solid cornflowerblue;
	  height:100%;
	}
	.open .hidden-box {
	  padding-top:24px;
	  max-height: 100%;
	}
	.open .number {
	  color: #087f5b;
	}
	.open .text {
	  color: cornflowerblue;
	}
	.icon {
	  width: 24px;
	  color: blue;
	  font-size: larger;
	  stroke-width: 2px;
	}
	.number {
	  font-size: 24px;
	}
	.text {
	  font-size: 24px;
	  font-weight: 500;
	}
	.number {
	  color: grey;
	}
	.hidden-box p {
	  margin-bottom: 10px;
	}
	.hidden-box ul {
	  font-size: 14px;
	  color: grey;
	  margin-left: 15px;
	  display: flex;
	  flex-direction: column;
	  gap: 12px;
	}
	</style>

	<script>
	const questions = document.querySelectorAll('.items')
	questions.forEach(question=>{
	  question.addEventListener('click',()=>{
		if(question.classList.contains('open')){
		  question.nextElementSibling.style.maxHeight =0;
		}else{
		  question.nextElementSibling.style.maxHeight = question.nextElementSibling.scrollHeight + "px";
		}
		question.classList.toggle('open')
	  })
	})
	</script>

	<style>
	#myInput {
	  background-position: 10px 12px; /* Position the search icon */
	  background-repeat: no-repeat; /* Do not repeat the icon image */
	  width: 90%; /* Full-width */
	  font-size: 16px; /* Increase font-size */
	  padding: 12px 20px 12px 40px; /* Add some padding */
	  border: 1px solid #ddd; /* Add a grey border */
	  margin-bottom: 12px; /* Add some space below the input */
	}
	
	#myUL {
	  /* Remove default list styling */
	  list-style-type: none;
	  padding: 0;
	  margin: 0;
	}
	
	#myUL li a {
	  border: 1px solid #ddd; /* Add a border to all links */
	  margin-top: -1px; /* Prevent double borders */
	  background-color: #f6f6f6; /* Grey background color */
	  padding: 12px; /* Add some padding */
	  text-decoration: none; /* Remove default text underline */
	  font-size: 18px; /* Increase the font-size */
	  color: black; /* Add a black text color */
	  display: block; /* Make it into a block element to fill the whole list */
	}

	#myUL li a:hover:not(.header) {
	  background-color: #eee; /* Add a hover effect to all links, except for headers */
	}  
	</style>  

	<script>
	function myFunction() {
	  // Declare variables
	  var input, filter, ul, li, a, i, txtValue;
	  input = document.getElementById('myInput');
	  filter = input.value.toUpperCase();
	  ul = document.getElementById("myUL");
	  li = ul.getElementsByTagName('li');
	
	  // Loop through all list items, and hide those who don't match the search query
	  for (i = 0; i < li.length; i++) {
	    a = li[i].getElementsByTagName("a")[0];
	    txtValue = a.textContent || a.innerText;
	    if (txtValue.toUpperCase().indexOf(filter) > -1) {
	      li[i].style.display = "";
	    } else {
	      li[i].style.display = "none";
	    }
	  }
	}
	</script>

  <input type="text" id="myInput" onkeyup="myFunction()" placeholder="Search for names..">
