  <style>
.search {
    display: flex;

}

    margin-right: 10px;

    display: none;
}

 <body>

<div class="search">
    <button  class="dropBtn">Menu</button>
    <input id="searchBox" onkeyup="search_links()" type="text"  name="searchBox"  placeholder="Search">
</div>
<!-- ul needs to be moved outside the flex container -->
<ul class="searchList" id ='searchList'>
    <!-- 'searchLinks' class should be at the <li> level, not <a> -->
    <li class="searchLinks"><a href="../Covid_Website/pages/buisnessGuidance.html">Buisness Guidance</a></li>
    <li class="searchLinks"><a href="pages/indivdualGuidance.html">Guidance for Indivduals</a></li>

    <li class="searchLinks"><a href="pages/help.html">Help and Contact</a></li>
</ul>
<div>Rest of the page...</div>
   

   <script>
function search_links() {
    const inputValue = document.getElementById('searchBox').value.toLowerCase();
    [...document.getElementsByClassName('searchLinks')].forEach((searchLink) => {
        const matched = inputValue && searchLink.innerHTML.toLowerCase().includes(inputValue);
        searchLink.style.display = matched ? 'list-item' : 'none';
    });
}
   </script>
