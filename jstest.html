<html>
  <title>
    <head></head>
  </title>
 <body>

<script>   
// Get references to the HTML elements by their IDs
const statusElement = document.getElementById("status");
const coordinatesElement = document.getElementById("coordinates");

if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(showPosition, showError);
} else {
    statusElement.innerHTML = "Geolocation is not supported by this browser.";
}

// Callback function for successful retrieval of position
function showPosition(position) {
    const latitude = position.coords.latitude;
    const longitude = position.coords.longitude;
    statusElement.innerHTML = "Location found:";
    coordinatesElement.innerHTML = "Latitude: " + latitude + "<br>Longitude: " + longitude;
}

// Optional error handling function
function showError(error) {
    switch(error.code) {
        case error.PERMISSION_DENIED:
            statusElement.innerHTML = "User denied the request for Geolocation.";
            break;
        case error.POSITION_UNAVAILABLE:
            statusElement.innerHTML = "Location information is unavailable.";
            break;
        case error.TIMEOUT:
            statusElement.innerHTML = "The request to get user location timed out.";
            break;
        case error.UNKNOWN_ERROR:
            statusElement.innerHTML = "An unknown error occurred.";
            break;
    }
}
</script>

   <p id="status">Locating...</p>
<p id="coordinates"></p>
   
 </body>
</html>
