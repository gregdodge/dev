<body style="font-family:verdana;background-color:;">
	
	<style>
	  button {font-family:verdana;}
	</style>

<div style="width:100%">  
<div style="max-width:650px;margin: 0 auto;border:1px solid grey;padding:25px 50px 50px 50px;">  

  <h1>jQuery - Examples</h1>

	<p style="height:15px;"/>  

	<p></p>
	  <hr style="border:none;height: 1px;background-color:grey;"/>
	<p></p>    
	
	<p><b>Example 1 - click() method:</b></p>

	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script>
	$(document).ready(function(){
	  $("p").click(function(){
	    $(this).hide();
	  });
	});
	</script>

	<p>&nbsp;&bull;&nbsp;Click to disappear</p>
	<p>&nbsp;&bull;&nbsp;Click any Example to erase it</p>
	
	<p></p>
	  <hr style="border:none;height: 1px;background-color:grey;"/>
	<p></p>   	
	
	<p><b>Example 2 - fadeIn() method:</b></p>	

	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script>
	$(document).ready(function(){
	  $("button").click(function(){
	    $("#div1").fadeIn(3000);
	    $("#div2").fadeIn(6000);
	    $("#div3").fadeIn(9000);
	  });
	});
	</script>

	<button>Click to fade in</button><br><br>

	 <div id="div1" style="width:80px;height:80px;display:none;background-color:coral;margin-bottom:10px;border-radius:15px;"></div>
	 <div id="div2" style="width:80px;height:80px;display:none;background-color:lightgreen;margin-bottom:10px;border-radius:15px;"></div>
	 <div id="div3" style="width:80px;height:80px;display:none;background-color:lightblue;margin-bottom:10px;border-radius:15px;"></div>
		
	<p></p>
	  <hr style="border:none;height: 1px;background-color:grey;"/>
	<p></p>   	
	
	<p><b>Example 3 - draggable:</b></p>	
	  <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.2/themes/base/jquery-ui.css">
	  <style>
	  body {font-family: Arial, Helvetica, sans-serif;} 
      table {font-size: 1em;}
      .ui-draggable, .ui-droppable {background-position: center;}	  
	  #draggable {width: 150px; height: 100px; padding: 50px;}
	  </style>
	  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
	  <script src="https://code.jquery.com/ui/1.14.2/jquery-ui.js"></script>
	  <script>
	  $( function() {
	    $( "#draggable" ).draggable();
	  } );
	  </script>
	</head>
	<body>
	 
	<div id="draggable" class="ui-widget-content">
	  <p>Drag around</p>
	</div>
